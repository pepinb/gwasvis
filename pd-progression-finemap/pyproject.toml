[project]
name = "pd-progression-finemap"
version = "0.1.0"
description = "Statistical fine-mapping pipeline for PD progression GWAS loci"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "pyarrow",
    "plotly",
    "streamlit",
    "tabulate",
    "pytest",
    "modal",
    "pyfaidx",
    "matplotlib",
    "joblib>=1.5.3",
    "scikit-learn>=1.8.0",
    "pyliftover>=0.4.1",
]

[dependency-groups]
dev = [
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
