[project]
name = "pd-progression-finemap"
version = "0.1.0"
description = "Statistical fine-mapping pipeline for PD progression GWAS loci"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "pyarrow",
    "plotly",
    "streamlit",
    "tabulate",
    "pytest",
]

[dependency-groups]
dev = [
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
